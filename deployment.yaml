apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-frontend
  template:
    metadata:
      labels:
        app: appointment-frontend
    spec:
      containers:
      - name: appointment-frontend
        image: vigneshlucky000/harness
        ports:
        - containerPort: 80
